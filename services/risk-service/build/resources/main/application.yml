server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/risk
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bankops-risk-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

bankops:
  risk:
    amount-hold-threshold-cents: 50000
    velocity-max-transfers: 3
    velocity-window-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
