server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092

bankops:
  outbox:
    batch-size: 20
    poll-ms: 250
  internal-endpoints:
    enabled: true
  ledger:
    base-url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
